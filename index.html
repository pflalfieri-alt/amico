<!doctype html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E3648">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UniAC Amico">
<title>UniAC - Porta un amico</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%232E3648'/%3E%3Ctext x='90' y='118' font-size='96' font-family='Arial' font-weight='700' fill='%23F28C00' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E">
<style>
:root{--blu:#2E3648;--blu2:#3b4660;--or:#F28C00;--bg:#f4f5f8;--tx:#1d2330;--mu:#6b7385;--ok:#1a8f4c;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--blu);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 22px 22px}
header .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
header b{font-size:1.05rem;letter-spacing:.2px}header span.pt{color:var(--or)}
header small{opacity:.8}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(20,30,50,.08)}
h1{font-size:1.35rem;margin:0 0 6px}h2{font-size:1.05rem;margin:0 0 10px}p{margin:0 0 10px}
.mu{color:var(--mu);font-size:.9rem}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:13px 14px;border:1.5px solid #d6d9e2;border-radius:12px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:var(--or);color:#fff;margin-top:14px;cursor:pointer}
.btn.sec{background:#e9ebf2;color:var(--blu)}.btn.wa{background:#1fa855}
.btn:disabled{opacity:.6}
.row{display:flex;gap:10px}.row>*{flex:1}
.cred{background:linear-gradient(135deg,var(--blu),var(--blu2));color:#fff;text-align:center;padding:22px 16px}
.cred .n{font-size:3rem;font-weight:800;line-height:1;color:#fff}.cred .n small{font-size:1rem;opacity:.85;font-weight:600}
.stats{display:flex;gap:10px;margin-top:14px}.stats div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:1.3rem}
.link{background:#f1f2f7;border-radius:12px;padding:12px;word-break:break-all;font-size:.9rem}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:.85rem;color:var(--mu)}.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eceef4}.item:last-child{border:0}
.tag{font-size:.75rem;padding:4px 10px;border-radius:99px;background:#e9ebf2;color:var(--blu);white-space:nowrap}.tag.ok{background:#dff3e7;color:var(--ok)}.tag.or{background:#fdecd2;color:#a85d00}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;border-top:1px solid #e3e5ec;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 2px;font:inherit;font-size:.72rem;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:1.3rem}nav button.on{color:var(--or);font-weight:700}
.msg{max-width:82%;padding:10px 13px;border-radius:14px;margin:6px 0;font-size:.95rem;white-space:pre-wrap}
.msg.u{background:var(--blu);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.msg.t{background:#eceef4;border-bottom-left-radius:4px}
.err{color:#b3261e;font-size:.9rem;margin-top:8px;min-height:1.2em}
.foot{text-align:center;color:var(--mu);font-size:.78rem;margin:20px 0 0}
.hide{display:none!important}
</style></head><body>
<header><div class="top"><div><b>Uni<span class="pt">AC</span></b> <small>· Porta un amico</small></div><button id="esci" class="hide" style="background:none;border:0;color:#fff;opacity:.8;font:inherit;font-size:.85rem">Esci</button></div><div id="hsub" style="margin-top:10px"></div></header>
<main id="m"></main>
<nav id="nav" class="hide">
<button data-t="home" class="on"><i>🏠</i>Home</button><button data-t="amici"><i>👥</i>Amici</button><button data-t="premi"><i>🎁</i>Premi</button><button data-t="news"><i>📰</i>Novità</button><button data-t="chat"><i>💬</i>Tutor</button>
</nav>
<script>
var API='https://script.google.com/macros/s/AKfycbyt_D2hqv5w2xhrUnJfLWKs0xN-9isJWoKo0dbQ-SvW7TiEuADCJJa1k2SKgfg5nCc_vQ/exec', PRIVACY='https://www.uniacformazione.com/privacy-policy/';
var M=document.getElementById('m'), NAV=document.getElementById('nav'), HS=document.getElementById('hsub');
var S={tok:null,p:null,tab:'home'};
try{S.tok=localStorage.getItem('uw_amico_t')}catch(e){}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function call(a,d){d=d||{};d.action=a;if(S.tok&&!d.token)d.token=S.tok;
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)}).then(function(r){return r.json()}).catch(function(){return {ok:false,errore:'Connessione non riuscita. Riprova.'}})}
function dt(x){try{var d=new Date(x);return d.toLocaleDateString('it-IT',{day:'2-digit',month:'short'})}catch(e){return ''}}
function html(h){M.innerHTML=h}
var q=new URLSearchParams(location.search), COD=(q.get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);
var CA=(q.get('s')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);try{if(CA)localStorage.setItem('uw_amico_s',CA);else CA=localStorage.getItem('uw_amico_s')||''}catch(e){}

/* ---------- pagina per l'amico ---------- */
function paginaAmico(){
  html('<div class="card"><h1>Un amico ti consiglia UniAC</h1><p>Lauree online, master, corsi e qualifiche con un <b>tutor di accoglienza</b> che ti segue dall\'iscrizione al titolo. Lascia i tuoi dati: ti richiamiamo noi, <b>gratis e senza impegno</b>.</p>'+
  '<label>Nome e cognome</label><input id="n" autocomplete="name"><label>Telefono</label><input id="t" type="tel" autocomplete="tel" inputmode="tel"><label>Email (facoltativa)</label><input id="e" type="email" autocomplete="email">'+
  '<label>Cosa ti interessa?</label><select id="i"><option value="">Scegli...</option><option>Laurea online</option><option>Master</option><option>Mondo Scuola (docenti e ATA)</option><option>Corsi e qualifiche</option><option>Sicurezza sul lavoro</option><option>Non so, voglio un consiglio</option></select>'+
  '<div class="chk"><input type="checkbox" id="c1"><span>Ho letto l\'<a href="'+PRIVACY+'" target="_blank" rel="noopener">informativa privacy</a> e acconsento al trattamento dei miei dati per essere ricontattato. *</span></div>'+
  '<div class="chk"><input type="checkbox" id="c2"><span>Acconsento a ricevere comunicazioni informative (facoltativo).</span></div>'+
  '<button class="btn" id="go">Richiedi di essere richiamato</button><div class="err" id="er"></div></div>'+
  '<p class="foot">Servizio gratuito · Numero Verde <a href="tel:800598033">800 598 033</a></p>');
  document.getElementById('go').onclick=function(){var b=this;b.disabled=true;
    call('invia_segnalazione',{codice:COD,nome:v('n'),telefono:v('t'),email:v('e'),interesse:v('i'),consenso_privacy:ck('c1'),consenso_marketing:ck('c2')}).then(function(r){
      if(r.ok){html('<div class="card"><h1>Grazie!</h1><p>Abbiamo ricevuto la tua richiesta. Un tutor di accoglienza ti richiamerà al più presto.</p><p class="mu">Se hai fretta chiama il Numero Verde gratuito <a href="tel:800598033">800 598 033</a>.</p></div>')}
      else{b.disabled=false;document.getElementById('er').textContent=r.errore||'Errore'}})};
}
function v(id){return document.getElementById(id).value} function ck(id){return document.getElementById(id).checked}

/* ---------- accesso ---------- */
function accesso(reg){
  NAV.classList.add('hide');document.getElementById('esci').classList.add('hide');HS.innerHTML='<small>Segnala UniAC a un amico, guadagna crediti e ottieni premi.</small>';
  html('<div class="card"><h1>'+(reg?'Crea il tuo account':'Accedi')+'</h1>'+
  (reg?'<div class="row"><div><label>Nome</label><input id="n"></div><div><label>Cognome</label><input id="c"></div></div>':'')+
  '<label>Telefono</label><input id="t" type="tel" inputmode="tel" autocomplete="tel">'+(reg?'<label>Email (facoltativa)</label><input id="e" type="email">':'')+
  '<label>PIN ('+(reg?'scegli da 4 a 6 cifre':'4-6 cifre')+')</label><input id="p" type="password" inputmode="numeric" maxlength="6" autocomplete="'+(reg?'new-password':'current-password')+'">'+
  (reg?'<div class="chk"><input type="checkbox" id="k"><span>Ho letto l\'<a href="'+PRIVACY+'" target="_blank" rel="noopener">informativa privacy</a> e acconsento al trattamento dei miei dati. *</span></div>':'')+
  '<button class="btn" id="go">'+(reg?'Registrati':'Entra')+'</button><div class="err" id="er"></div>'+
  '<button class="btn sec" id="sw">'+(reg?'Ho già un account':'Non ho un account')+'</button></div>');
  document.getElementById('sw').onclick=function(){accesso(!reg)};
  document.getElementById('go').onclick=function(){var b=this;b.disabled=true;
    var d=reg?{nome:v('n'),cognome:v('c'),telefono:v('t'),email:v('e'),pin:v('p'),consenso:ck('k'),sp:CA}:{telefono:v('t'),pin:v('p')};
    call(reg?'registra':'accedi',d).then(function(r){ if(r.ok){S.tok=r.token;try{localStorage.setItem('uw_amico_t',r.token)}catch(e){}avvia()}else{b.disabled=false;document.getElementById('er').textContent=r.errore||'Errore'} })};
}

/* ---------- app ---------- */
function avvia(){call('profilo').then(function(r){ if(!r.ok){S.tok=null;try{localStorage.removeItem('uw_amico_t')}catch(e){}return accesso(false)} S.p=r;NAV.classList.remove('hide');document.getElementById('esci').classList.remove('hide');HS.innerHTML='<small>Ciao</small> <b>'+esc(r.nome)+'</b>';tab(S.tab)})}
document.getElementById('esci').onclick=function(){S.tok=null;try{localStorage.removeItem('uw_amico_t')}catch(e){}accesso(false)};
[].forEach.call(NAV.querySelectorAll('button'),function(b){b.onclick=function(){tab(b.dataset.t)}});
function tab(t){S.tab=t;[].forEach.call(NAV.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.t===t)});window.scrollTo(0,0);({home:home,amici:amici,premi:premi,news:news,chat:chat})[t]()}
function home(){var p=S.p,msg=encodeURIComponent((p.messaggio||'')+' '+p.link);
  html('<div class="card cred"><div class="mu" style="color:#fff;opacity:.85">I tuoi crediti</div><div class="n">'+p.crediti+' <small>crediti</small></div><div class="stats"><div><b>'+p.segnalazioni+'</b><small>amici</small></div><div><b>'+p.iscritti+'</b><small>iscritti</small></div><div><b>'+p.crediti_totali+'</b><small>guadagnati</small></div></div></div>'+
  '<div class="card"><h2>Il tuo link personale</h2><p class="mu">Quando un amico lo apre e lascia i dati, la segnalazione è tua. Per ogni amico che si iscrive ricevi crediti pari al <b>'+p.percentuale+'%</b> dell\'importo netto (1 credito = 1 €).</p><p class="mu">Il tuo livello: <b>'+p.livello+'</b> ('+p.iscritti_mese+' iscrizioni questo mese). Da '+p.soglia_agente+' iscrizioni al mese diventi Agente, da '+p.soglia_orientatore+' Orientatore: crediti extra su ogni iscrizione.</p><div class="link" id="lk">'+esc(p.link)+'</div>'+
  '<a class="btn wa" style="text-decoration:none;text-align:center" href="https://wa.me/?text='+msg+'" target="_blank" rel="noopener">Condividi su WhatsApp</a><button class="btn sec" id="cp">Copia link</button></div>'+
  '<div class="card"><h2>Porta altri segnalatori</h2><p class="mu">Invita altre persone a diventare segnalatori con il tuo link: entrano nella tua rete.'+(p.rete?' Segnalatori nella tua rete: <b>'+p.rete+'</b>.':'')+'</p><div class="link">'+esc(p.link_rete||'')+'</div><a class="btn wa" style="text-decoration:none;text-align:center" href="https://wa.me/?text='+encodeURIComponent('Diventa segnalatore UniAC e guadagna crediti: '+(p.link_rete||''))+'" target="_blank" rel="noopener">Invita su WhatsApp</a><button class="btn sec" id="cp2">Copia link</button></div>'+
  '<div class="card"><h2>Come funziona</h2><p>1. Mandi il tuo link a un amico.<br>2. Un tutor lo richiama, senza impegno.<br>3. Se si iscrive e paga, i crediti arrivano qui dopo 30 giorni.<br>4. Spendi i crediti nei premi.</p></div>');
  document.getElementById('cp2').onclick=function(){var b=this;(navigator.clipboard?navigator.clipboard.writeText(p.link_rete||''):Promise.reject()).then(function(){b.textContent='Copiato ✓'}).catch(function(){b.textContent='Tieni premuto sul link'})};
  document.getElementById('cp').onclick=function(){var b=this;(navigator.clipboard?navigator.clipboard.writeText(p.link):Promise.reject()).then(function(){b.textContent='Copiato ✓'}).catch(function(){var r=document.createRange();r.selectNodeContents(document.getElementById('lk'));var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Seleziona e copia'})};
}
function amici(){html('<div class="card"><h2>I miei amici</h2><div id="l" class="mu">Caricamento...</div></div>');
  call('mie_segnalazioni').then(function(r){var l=document.getElementById('l');if(!r.ok){l.textContent=r.errore;return}
    if(!r.lista.length){l.innerHTML='Ancora nessun amico. Condividi il tuo link dalla Home.';return}
    l.className='';l.innerHTML=r.lista.map(function(x){var ok=x.stato==='Iscritto';return '<div class="item"><div><b>'+esc(x.nome)+'</b><div class="mu">'+dt(x.data)+'</div></div><div style="text-align:right"><span class="tag '+(ok?'ok':'')+'">'+(ok?'Iscritto +'+x.crediti:'In lavorazione')+'</span></div></div>'}).join('')})}
function premi(){html('<div class="card"><h2>Premi</h2><p class="mu">Hai <b>'+S.p.crediti+'</b> crediti. Puoi richiedere un premio da <b>'+S.p.riscatto_min+'</b> crediti. I crediti non scadono e diventano utilizzabili 30 giorni dopo il pagamento dell\'iscritto.'+(S.p.in_maturazione?' In maturazione: <b>'+S.p.in_maturazione+'</b>.':'')+'</p><div id="l">Caricamento...</div></div><div class="card"><h2>Le mie richieste</h2><div id="r" class="mu">...</div></div>');
  call('premi').then(function(r){var l=document.getElementById('l');if(!r.ok){l.textContent=r.errore;return}
    l.innerHTML=r.lista.map(function(x){return '<div class="item"><div><b>'+esc(x.titolo)+'</b><div class="mu">'+esc(x.descrizione)+'</div></div><button class="btn" style="width:auto;margin:0;padding:10px 14px" data-i="'+x.id+'" '+(S.p.crediti<Math.max(x.costo,S.p.riscatto_min)?'disabled':'')+'>'+x.costo+' cr.</button></div>'}).join('')||'Nessun premio disponibile.';
    [].forEach.call(l.querySelectorAll('button[data-i]'),function(b){b.onclick=function(){if(!confirm('Vuoi richiedere questo premio?'))return;b.disabled=true;call('riscatta',{premio_id:b.dataset.i}).then(function(x){if(x.ok){alert('Richiesta inviata. Ti contatteremo per la consegna.');avvia()}else{alert(x.errore);b.disabled=false}})}})});
  call('mie_richieste').then(function(r){var l=document.getElementById('r');if(!r.ok||!r.lista.length){l.textContent='Nessuna richiesta.';return}l.className='';l.innerHTML=r.lista.map(function(x){return '<div class="item"><div><b>'+esc(x.premio)+'</b><div class="mu">'+dt(x.data)+' · '+x.crediti+' cr.</div></div><span class="tag or">'+esc(x.stato)+'</span></div>'}).join('')})}
function news(){html('<div class="card"><h2>Novità e promozioni</h2><div id="l" class="mu">Caricamento...</div></div>');
  call('news').then(function(r){var l=document.getElementById('l');if(!r.ok||!r.lista.length){l.textContent='Nessuna novità.';return}l.className='';l.innerHTML=r.lista.map(function(x){return '<div class="item" style="display:block"><span class="tag '+(x.tipo==='promo'?'or':'')+'">'+(x.tipo==='promo'?'Promozione':'Novità')+'</span> <span class="mu">'+dt(x.data)+'</span><div style="margin-top:6px"><b>'+esc(x.titolo)+'</b></div><div>'+esc(x.testo)+'</div></div>'}).join('')})}
function chat(){html('<div class="card"><h2>Scrivi a un tutor</h2><div id="l" class="mu">Caricamento...</div><label>Il tuo messaggio</label><textarea id="t" rows="3" maxlength="800"></textarea><button class="btn" id="go">Invia</button><div class="err" id="er"></div><p class="mu" style="margin-top:12px">Ti rispondiamo il prima possibile. Per urgenze: Numero Verde <a href="tel:800598033">800 598 033</a>.</p></div>');
  function load(){call('chat_lista').then(function(r){var l=document.getElementById('l');if(!r.ok){l.textContent=r.errore;return}l.className='';l.innerHTML=r.lista.length?r.lista.map(function(x){return '<div class="msg '+(x.da==='utente'?'u':'t')+'">'+esc(x.testo)+'</div>'}).join(''):'<span class="mu">Nessun messaggio. Scrivici pure!</span>'})}
  load();document.getElementById('go').onclick=function(){var b=this,t=v('t');if(!t.trim())return;b.disabled=true;call('chat_invia',{testo:t}).then(function(r){b.disabled=false;if(r.ok){document.getElementById('t').value='';load()}else document.getElementById('er').textContent=r.errore})}}

if(COD){paginaAmico()} else if(S.tok){avvia()} else {accesso(!!q.get('s'))}
</script></body></html>
